name: 일정 알림 텔레그램 전송

on:
  schedule:
    - cron: '50 22 * * *'   # 07:50 KST (UTC+9)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '보내지 않고 메시지만 확인'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 보낼 일정 고르기
        id: pick
        run: |
          if python3 .github/scripts/schedule_check.py > message.txt; then
            echo "보낼 내용:"
            cat message.txt
            echo "skip=0" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -eq 9 ]; then
              echo "skip=1" >> "$GITHUB_OUTPUT"
            else
              echo "::error::schedule_check.py 가 $code 로 실패했습니다."
              exit "$code"
            fi
          fi

      - name: 텔레그램 전송
        if: steps.pick.outputs.skip != '1' && inputs.dry_run != true
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: "-5431684710"  # 텔레그램 그룹 "일정알림봇". 뉴스 개인방과 분리
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TELEGRAM_TOKEN 시크릿이 등록되지 않았습니다."
            exit 1
          fi
          n=$(python3 .github/scripts/tg_split.py message.txt)
          echo "메시지 $n 통으로 분할"
          i=0; fail=0
          for f in parts/*.txt; do
            i=$((i+1))
            resp=$(curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
              -d chat_id="$CHAT_ID" -d parse_mode=HTML -d disable_web_page_preview=true \
              --data-urlencode "text@$f")
            if echo "$resp" | grep -q '"ok":true'; then
              echo "  $i/$n 전송 성공 (HTML)"
            else
              echo "  $i/$n HTML 거부, 평문 재시도: $(echo "$resp" | head -c 200)"
              sed -e 's/<[^>]*>//g' "$f" > "$f.plain"
              resp2=$(curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
                -d chat_id="$CHAT_ID" -d disable_web_page_preview=true \
                --data-urlencode "text@$f.plain")
              if echo "$resp2" | grep -q '"ok":true'; then
                echo "  $i/$n 평문 성공"
              else
                fail=$((fail+1)); echo "  $i/$n 실패: $(echo "$resp2" | head -c 200)"
              fi
            fi
            sleep 1
          done
          echo "완료: $((n-fail))/$n 전송"
          if [ "$fail" -gt 0 ]; then exit 1; fi
